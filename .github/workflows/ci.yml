name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: >
          pytest -v --junitxml=junit-${{ matrix.python-version }}.xml
          --ignore=tests/test_flights_fuzz.py
          --ignore=tests/test_cruises_fuzz.py
          --ignore=tests/test_apify_client_fuzz.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-results-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml

  fuzz:
    name: Fuzz (Hypothesis)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run adversarial tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: >
          pytest -v
          tests/test_flights_fuzz.py
          tests/test_cruises_fuzz.py
          tests/test_apify_client_fuzz.py
